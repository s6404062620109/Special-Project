<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Network Traffic Monitor - Worm Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      margin: auto;
      width: 80%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #333;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
      cursor: pointer;
    }

    #responseBox {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <h2>📡 Network Traffic Monitor</h2>
  <p style="text-align:center;">คลิกที่ IP ที่คุณสงสัยว่าเป็นการโจมตี Worm</p>

  <table>
    <tr>
      <th>Source IP</th>
      <th>Destination IP</th>
      <th>Activity</th>
    </tr>
    <tr onclick="recordAction('192.168.1.15')">
      <td>192.168.1.15</td><td>10.0.0.5</td><td>Web browsing</td>
    </tr>
    <tr onclick="recordAction('192.168.1.101')">
      <td>192.168.1.101</td><td>10.0.0.20</td><td>Scanning ports repeatedly</td>
    </tr>
    <tr onclick="recordAction('192.168.1.50')">
      <td>192.168.1.50</td><td>10.0.0.10</td><td>Email traffic</td>
    </tr>
    <tr onclick="recordAction('192.168.1.200')">
      <td>192.168.1.200</td><td>10.0.0.25</td><td>File sharing</td>
    </tr>
  </table>

  <div id="responseBox"></div>

  <script>
    function recordAction(action) {
      document.getElementById('responseBox').innerText = 'คุณเลือก: ' + action;
      // ส่งข้อมูลไป parent frame (ถ้าใช้ embed)
      window.parent.postMessage({ answer: action }, "*");
    }
  </script>

</body>
</html>
