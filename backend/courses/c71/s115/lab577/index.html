<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Lab - Baiting Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0; padding: 0;
    }
    .overlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.3);
      display:flex; justify-content:center; align-items:center;
    }
    .ad-container {
      position: relative;
      width: 420px;
      background: #fff;
      border: 2px solid #f06292;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      padding: 20px;
      text-align: center;
    }
    .ad-container h2 {
      color: #d32f2f; margin-bottom: 10px;
    }
    .ad-container p {
      font-size: 15px; margin-bottom: 18px;
    }
    .download-btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }
    .download-btn:hover { background: #43a047; }
    .report-btn {
      margin-top: 14px;
      display: inline-block;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }
    .report-btn:hover { background: #1565c0; }
    .close-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px; height: 22px;
      border: none;
      border-radius: 50%;
      background: #eee;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover {
      background: #ccc;
    }
    #responseBox {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      color: #0d47a1;
    }
  </style>
</head>
<body>

<div class="overlay">
  <div class="ad-container">
    <button class="close-btn" onclick="recordAction('ปิดป็อปอัพ')">×</button>
    <h2>🎁 ดาวน์โหลดฟรี! โปรแกรมมูลค่า 5,000 บาท</h2>
    <p>ข้อเสนอพิเศษสำหรับคุณเท่านั้น<br>⏰ รีบด่วน ก่อนหมดเวลา!</p>
    <button class="download-btn" onclick="recordAction('คลิกดาวน์โหลดไฟล์ที่ไม่น่าเชื่อถือ')">Download Now</button><br>
  </div>
</div>

<script>
function recordAction(action) {
  window.parent.postMessage({ answer: action }, "*");
}
</script>

</body>
</html>
