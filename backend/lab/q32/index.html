<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Attack Lab</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            background: #0073e6;
            color: #fff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .mailContainer {
            background-color: #fff;
        }

        .mailContainer > div {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }

        .mailContainer > div:hover {
            cursor: pointer;
            background-color: #f1f9ff;
        }

        .footer {
            background: #f4f4f4;
            color: #555;
            font-size: 14px;
            padding: 10px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Email Notifications</header>
        <div class='mailContainer'>
            <div data-href="./result.html" data-topic="Suspicious activity detected on your account">Suspicious activity detected on your account</div>
            <div data-href="./result.html" data-topic="Your account has been compromised">Your account has been compromised</div>
            <div data-href="./result.html" data-topic="Verification required to access your code">Verification required to access your code</div>
            <div data-href="./result.html" data-topic="Congratulations! You've won a $1000 gift card">Congratulations! You've won a $1000 gift card</div>
        </div>
        <div class="footer">&copy; 2024 Spam Attack Lab | All Rights Reserved</div>
    </div>

    <script>
        document.querySelectorAll('.mailContainer > div').forEach(div => {
            div.addEventListener('click', function() {
                const href = this.getAttribute('data-href');
                const topic = encodeURIComponent(this.getAttribute('data-topic'));     

                window.location.href = `${href}?topic=${topic}`;
            });
        });
    </script>
</body>
</html>
