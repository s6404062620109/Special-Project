<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            cursor: pointer; /* เพิ่ม cursor pointer เพื่อให้รู้ว่าสามารถคลิกได้ */
        }

        .popup h2 {
            color: red;
            font-size: 22px;
        }

        .popup p {
            font-size: 16px;
            color: #333;
        }

        .close-btn {
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .popup.normal-view {
            position: static;
            box-shadow: none;
            border-radius: 0;
            max-width: 100%;
            height: auto;
            padding: 20px;
            background: white;
            cursor: default;
        }

        .popup.normal-view h2 {
            color: black;
            font-size: 24px;
        }

        .popup.normal-view p {
            font-size: 18px;
            color: #555;
        }

        .popup.normal-view .close-btn {
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup" id="popup">
        <h2>⚠ Warning: Your Computer is Infected!</h2>
        <p>Suspicious activity has been detected on your system. Your personal data may be at risk.</p>
        <button class="close-btn" onclick="closePopup()">Close</button>
    </div>

    <script>
        let isPopupClicked = false;

        // ฟังก์ชันสำหรับสร้างคำตอบแบบสุ่ม
        function generateFakeAnswer() {
            const fakePasswords = [
                "P@ssw0rd123",
                "Secure!2023",
                "Admin#1234",
                "RandomPass!",
                "FakePassword123",
                "BaitingPassword!",
                "SimulatedPass#1"
            ];
            const randomIndex = Math.floor(Math.random() * fakePasswords.length);
            return fakePasswords[randomIndex];
        }

        function answer() {
            if (isPopupClicked) return; 
            const fakeAnswer = generateFakeAnswer();
            document.getElementById("popup").innerHTML = `
                <p><strong>Your are safe. This was a simulated attack. <br/> 
                Please take this password: ${fakeAnswer}</strong></p>
            `;
            isPopupClicked = true;
        }

        function changeToNormalView() {
            const popup = document.getElementById("popup");
            popup.classList.add("normal-view");
        }

        function closePopup() {
            if (isPopupClicked) return;
            changeToNormalView();
            document.getElementById("popup").innerHTML = `
                <p><strong>Your are safe. This was a simulated attack. <br/> 
                Please take this password: <!-- INSERT ANSWER HERE --></strong></p>
            `;
            isPopupClicked = true;
        }

        document.getElementById("popup").addEventListener("click", function(event) {
            if (isPopupClicked) return; 

            if (!event.target.classList.contains("close-btn")) {
                answer();
                changeToNormalView();
            }
        });

        setTimeout(() => {
            localStorage.setItem("answer", "Your system is safe. This was a simulated attack.");
        }, 1000);
    </script>
</body>
</html>
