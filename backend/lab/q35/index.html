<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impersonation Attack Lab</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            background: #0073e6;
            color: #fff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .mailContainer {
            background-color: #fff;
        }

        .mailContainer > div {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }

        .mailContainer > div:hover {
            cursor: pointer;
            background-color: #f1f9ff;
        }

        .footer {
            background: #f4f4f4;
            color: #555;
            font-size: 14px;
            padding: 10px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Email Notifications</header>
        <div class="mailContainer">
            <div data-href="./result.html" data-topic="Suspicious Login Attempt on Your Account">Suspicious Login Attempt on Your Account</div>
            <div data-href="./result.html" data-topic="Account Update Request">Account Update Request</div>
            <div data-href="./result.html" data-topic="Your Password Has Been Reset">Your Password Has Been Reset</div>
            <div data-href="./result.html" data-topic="Security Alert: Important Verification Needed">Security Alert: Important Verification Needed</div>
        </div>
        <div class="footer">&copy; 2024 Impersonation Attack Lab | All Rights Reserved</div>
    </div>

    <script>
        document.querySelectorAll('.mailContainer > div').forEach(div => {
            div.addEventListener('click', function() {
                const href = this.getAttribute('data-href');
                const topic = encodeURIComponent(this.getAttribute('data-topic'));     

                if (href.endsWith('.txt')) {
                    const randomText = generateRandomText(6, 10);
                    const blob = new Blob([randomText], { type: 'text/plain' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'fakefile.txt';
                    link.click();
                } else {
                    window.location.href = `${href}?topic=${topic}`;
                }
            });
        });

        function generateRandomText(minWords, maxWords) {
            const words = ['account', 'suspicious', 'security', 'reset', 'update', 'urgent', 'alert', 'compromised', 'secure', 'verify'];
            let text = '';
            const wordCount = Math.floor(Math.random() * (maxWords - minWords + 1)) + minWords;
            for (let i = 0; i < wordCount; i++) {
                text += words[Math.floor(Math.random() * words.length)] + ' ';
            }
            return text.trim();
        }
    </script>
</body>
</html>
