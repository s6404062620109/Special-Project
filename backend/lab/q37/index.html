<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scareware Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            position: relative;
        }

        .popup h2 {
            color: red;
            font-size: 22px;
        }

        .popup p {
            font-size: 16px;
            color: #333;
        }

        .popup a {
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }

        .popup .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }

        .popup.normal-view {
            position: static;
            box-shadow: none;
            border-radius: 0;
            max-width: 100%;
            height: auto;
            padding: 20px;
            background: white;
        }

        .popup.normal-view h2 {
            color: black;
            font-size: 24px;
        }

        .popup.normal-view p {
            font-size: 18px;
            color: #555;
        }

        .popup.normal-view button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup" id="popup">
        <button class="close-btn" onclick="closePopup()">×</button>
        <h2>⚠ Warning: Your Computer is Infected!</h2>
        <p>We have detected a virus on your system. Click the link below to download the fix:</p>
        <a id="downloadLink" href="#" onclick="downloadFile()">Download Fix Now</a>
    </div>

    <script>
        let isPopupClicked = false;

        // ฟังก์ชันสำหรับดาวน์โหลดไฟล์ปลอม
        function downloadFile() {
            if (isPopupClicked) return;

            // สร้างไฟล์ข้อความปลอม
            const fakeFileContent = "This is a simulated attack. Do not download files from unknown sources.";
            const blob = new Blob([fakeFileContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);

            // สร้างลิงก์สำหรับดาวน์โหลด
            const link = document.createElement("a");
            link.href = url;
            link.download = "fix_virus.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            // แสดงข้อความหลังจากดาวน์โหลด
            document.getElementById("popup").innerHTML = `
                <h2>⚠ Scam Alert!</h2>
                <p>You downloaded file Successful. Please install for elimanate your virus.</p>
            `;
            isPopupClicked = true;
            alert("This was a simulated attack. Do not download files from unknown sources!");
        }

        // ฟังก์ชันสำหรับแสดงข้อความเมื่อผู้ใช้กดปิดโฆษณา
        function closePopup() {
            if (isPopupClicked) return;

            document.getElementById("popup").innerHTML = `
                <h2>You are Safe!</h2>
                </p><!-- INSERT ANSWER HERE --></p>
            `;
            isPopupClicked = true;
        }

        // ตั้งเวลาเพื่อแสดง Pop-up หลังจากโหลดหน้าเว็บ
        setTimeout(() => {
            document.getElementById("popup").style.display = "block";
        }, 1000);
    </script>
</body>
</html>
