<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Support Scam Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            position: relative;
        }

        .popup h2 {
            color: red;
            font-size: 22px;
        }

        .popup p {
            font-size: 16px;
            color: #333;
        }

        .popup input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .popup button {
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        .popup .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }

        .popup.normal-view {
            position: static;
            box-shadow: none;
            border-radius: 0;
            max-width: 100%;
            height: auto;
            padding: 20px;
            background: white;
        }

        .popup.normal-view h2 {
            color: black;
            font-size: 24px;
        }

        .popup.normal-view p {
            font-size: 18px;
            color: #555;
        }

        .popup.normal-view button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup" id="popup">
        <button class="close-btn" onclick="closePopup()">×</button>
        <h2>⚠ Warning: Your Computer is Infected!</h2>
        <p>We have detected a virus on your system. Please contact our support team immediately to resolve this issue.</p>
        <input type="text" id="username" placeholder="Enter your username">
        <input type="password" id="password" placeholder="Enter your password">
        <button onclick="submitInfo()">Contact Support</button>
    </div>

    <script>
        let isPopupClicked = false;

        // ฟังก์ชันสำหรับแสดงข้อความเมื่อผู้ใช้กรอกข้อมูล
        function submitInfo() {
            if (isPopupClicked) return;

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username && password) {
                document.getElementById("popup").innerHTML = `
                    <h2>⚠ Scam Alert!</h2>
                    <p>You have been scammed! This was a simulated attack. Do not share your personal information with unknown sources.</p>
                `;
                isPopupClicked = true;
                alert("This was a simulated attack. Do not share your personal information!");
            } else {
                alert("Please fill in both username and password.");
            }
        }

        // ฟังก์ชันสำหรับแสดงข้อความเมื่อผู้ใช้กดปิดโฆษณา
        function closePopup() {
            if (isPopupClicked) return;

            document.getElementById("popup").innerHTML = `
                <h2>You are Safe!</h2>
                <p><!-- INSERT ANSWER HERE --></strong></p>
            `;
            isPopupClicked = true;
        }

        // ตั้งเวลาเพื่อแสดง Pop-up หลังจากโหลดหน้าเว็บ
        setTimeout(() => {
            document.getElementById("popup").style.display = "block";
        }, 1000);
    </script>
</body>
</html>
