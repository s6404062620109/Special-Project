<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Page</title>
    <style>
        body {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Mail Details</h1>
    <h2 id="topic"></h2>

    <div id="content">
    </div>

    <script>
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const topic = getQueryParameter('topic');

        if (topic) {
            document.getElementById('topic').textContent = `Subject: ${decodeURIComponent(topic)}`;
        } else {
            document.getElementById('topic').textContent = 'No subject found';
        }

        const contentDiv = document.getElementById('content');

        // Show phishing-like content for "Suspicious transaction detected on your account"
        if (topic === 'Suspicious transaction detected on your account') {
            contentDiv.innerHTML += `
                <div class="phishing">
                    <h3>Security Alert from Your Bank</h3>
                    <p>Your bank has detected suspicious activity on your account. Please <a href="#">click here</a> to verify your information and avoid account suspension.</p>
                    <p>Note: Please act within 24 hours, or your account may be suspended.</p>
                    <p>Thank you,<br>Your Bank's Security Team</p>
                </div>
            `;
        }
        // Show normal content for "Third-party attack alert on your account"
        else if (topic === 'Third-party attack alert on your account') {
            contentDiv.innerHTML += `
                <div class="normal">
                    <h3>Third-party Attack Alert</h3>
                    <p>We have detected an attempt to access your account from a third party. If this wasn't you, please change your password immediately and review your security settings.</p>
                    <h4 id="answerResult"><!-- INSERT ANSWER HERE --></h4>
                    <p>Thank you for your cooperation.<br>Security Support Team</p>
                </div>
            `;
        }

    </script>
</body>
</html>
