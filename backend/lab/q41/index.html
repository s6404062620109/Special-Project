<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Attack Lab</title>
    <style>
        body {
            background: #d9d9d9;
        }

        .mailContainer {
            background-color: white;
        }
        .mailContainer > div {
            border-bottom: 1px solid;
        }
        .mailContainer > div:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>You have received a notification email</h1>
    <div class='mailContainer'>
        <div data-href="./result.html" data-topic="Suspicious transaction detected on your account">Suspicious transaction detected on your account</div>
        <div data-href="./result.html" data-topic="Third-party attack alert on your account">Third-party attack alert on your account</div>
    </div>

    <script>

        document.querySelectorAll('.mailContainer > div').forEach(div => {
            div.addEventListener('click', function() {
                const href = this.getAttribute('data-href');
                const topic = encodeURIComponent(this.getAttribute('data-topic'));     

                window.location.href = `${href}?topic=${topic}`;
            });
        });
    </script>
</body>
</html>
