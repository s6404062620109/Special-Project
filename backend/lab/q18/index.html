<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Attack Lab</title>
    <style>
        body {
            background: #d9d9d9;
        }

        .mailContainer {
            background-color: white;
        }
        .mailContainer > div {
            border-bottom: 1px solid;
        }
        .mailContainer > div:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Mailbox</h1>
    <div class='mailContainer'>
        <div data-href="./result.html" data-topic="Your Account Has Been Suspended – Immediate Action Required!">Your Account Has Been Suspended – Immediate Action Required!</div>
        <div data-href="./result.html" data-topic="Congratulations! You’ve Won a $500 Gift Card!">Congratulations! You’ve Won a $500 Gift Card!</div>
        <div data-href="./result.html" data-topic="Verify your identity – Please Action in 1 hr!">Verify your identity – Please Action in 1 hr!</div>
    </div>

    <script>

        document.querySelectorAll('.mailContainer > div').forEach(div => {
            div.addEventListener('click', function() {
                const href = this.getAttribute('data-href');
                const topic = encodeURIComponent(this.getAttribute('data-topic'));     

                window.location.href = `${href}?topic=${topic}`;
            });
        });
    </script>
</body>
</html>
