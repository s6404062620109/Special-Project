<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Page</title>
    <style>
        body {
            background: #f0f0f0;
        }
        .phishing, .phishing-hack {
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>รายละเอียดอีเมล</h1>
    <h2 id="topic"></h2>

    <div id="content"></div>

    <script>
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const topic = getQueryParameter('topic');

        if (topic) {
            document.getElementById('topic').textContent = `หัวข้อ: ${decodeURIComponent(topic)}`;
        } else {
            document.getElementById('topic').textContent = 'ไม่พบหัวข้อ';
        }

        const contentDiv = document.getElementById('content');

        function generateRandomCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Show phishing-like content for "Suspicious transaction detected on your account"
        if (topic === 'ตรวจพบธุรกรรมที่น่าสงสัยในบัญชีของคุณ') {
            const randomCode = generateRandomCode();

            contentDiv.innerHTML += `
                <div class="phishing">
                    <h3>แจ้งเตือนด้านความปลอดภัยจากธนาคารของคุณ</h3>
                    <p>ธนาคารของคุณได้ตรวจพบกิจกรรมที่น่าสงสัยในบัญชีของคุณ กรุณายืนยันตัวตนของคุณเพื่อดูรหัส</p>
                </div>
            `;

            // Show verification form
            contentDiv.innerHTML += `
                <div class="phishing-hack">
                    <h3>การยืนยันเร่งด่วนที่จำเป็น!</h3>
                    <p>กรุณากรอกรายละเอียดของคุณด้านล่าง:</p>
                    <form id="phishing-form">
                        <label for="email">อีเมล:</label>
                        <input type="email" id="email" required><br>
                        <label for="password">รหัสผ่าน:</label>
                        <input type="password" id="password" required><br>
                        <button type="submit">ยืนยัน</button>
                    </form>
                    <p><strong>คำเตือน:</strong> หากคุณไม่ยืนยัน บัญชีของคุณอาจถูกปิดใช้งาน</p>
                </div>
            `;

            // Handle form submission
            const form = document.getElementById('phishing-form');
            form.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent actual submission
                alert("ข้อมูลของคุณได้รับการส่งเรียบร้อยแล้ว ขอบคุณสำหรับความร่วมมือ");

                // Display the random code after verification
                contentDiv.innerHTML += `
                    <div>
                        <h3>รหัสของคุณ:</h3>
                        <h4>${randomCode}</h4>
                    </div>
                `;
            });

        }
        // Show normal content for "Third-party attack alert on your account"
        else if (topic === 'แจ้งเตือนการโจมตีจากบุคคลที่สามในบัญชีของคุณ') {
            contentDiv.innerHTML += `
                <div class="normal">
                    <h3>การแจ้งเตือนการโจมตีจากบุคคลที่สาม</h3>
                    <p>เราได้ตรวจพบความพยายามในการเข้าถึงบัญชีของคุณจากบุคคลที่สาม หากไม่ใช่คุณ กรุณาเปลี่ยนรหัสผ่านของคุณทันที</p>
                    <div>
                        <h3>รหัสของคุณ:</h3>
                        <h4><!-- INSERT ANSWER HERE --></h4>
                    </div>
                    <p>ขอบคุณสำหรับความร่วมมือของคุณ<br>ทีมสนับสนุนด้านความปลอดภัย</p>
                </div>
            `;
        }
    </script>
</body>
</html>
