# start : docker-compose up -d --build
# stop : docker-compose down
version: '4' 
services:
  node-server: 
    build: . 
    ports:
      - "3001:3001" 
    depends_on:
      - db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./routes:/usr/src/app/router
      - ./controller:/usr/src/app/controller
      - ./middleware:/usr/src/app/middleware
      - ./database.js:/usr/src/app/database.js
      - ./lab:/usr/src/app/lab
      - ./courses:/usr/src/app/courses
      - ./users:/usr/src/app/users
    env_file:
      - .env
      
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: SAT 
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_database:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # DB host
      PMA_PORT: 3306 # DB port
      PMA_USER: root # DB user
      PMA_PASSWORD: root # DB password
    ports:
      - "8081:80"
    depends_on:
      - db
  
  ubuntu-ui:
    image: dorowu/ubuntu-desktop-lxde-vnc
    container_name: ubuntu-ui
    ports:
      - "6080:80"
    volumes:
      - ./courses:/usr/src/app/courses
    environment:
      - USER=root
      - PASSWORD=root

volumes:
  mysql_data_test: 
    driver: local
