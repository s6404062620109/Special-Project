# start : docker-compose up -d --build
# stop : docker-compose down
# tar build : tar -cvf SAT_services.tar controller courses frontend middleware routes .env database.js docker-compose.yml Dockerfile index.js package-lock.json package.json wait-for-it.sh
# tar extained: tar -xvf SAT_services.tar   
version: '4' 
services:

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3003:80"
    depends_on:
      - node-server

  node-server: 
    build: . 
    ports:
      - "3002:3002" 
    depends_on:
      - db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./routes:/usr/src/app/routes
      - ./controller:/usr/src/app/controller
      - ./middleware:/usr/src/app/middleware
      - ./database.js:/usr/src/app/database.js
      - ./index.js:/usr/src/app/index.js
      - ./courses:/usr/src/app/courses
      - ./users:/usr/src/app/users
      - ./lab-session-data:/usr/src/app/lab-session-data
    env_file:
      - .env
      
  db:
    image: mysql:9.4
    environment:
      MYSQL_ROOT_PASSWORD: password_1234
      MYSQL_DATABASE: SAT 
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_database:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.2
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # DB host
      PMA_PORT: 3306 # DB port
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  mysql_data_test: 
    driver: local