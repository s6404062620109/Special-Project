<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Critical Virus Alert!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaeaea;
      padding: 20px;
    }

    .popup {
      background-color: #fff;
      color: black;
      border: 4px solid red;
      border-radius: 12px;
      width: 400px;
      margin: auto; /* Center horizontally */
      padding: 20px 20px 30px;
      box-shadow: 0 0 30px red;
      text-align: center;
      position: relative;
    }

    .popup h2 {
      color: red;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .popup p {
      font-size: 16px;
      margin: 10px 0;
    }

    .popup a {
      display: inline-block;
      background-color: red;
      color: white;
      padding: 10px 15px;
      margin-top: 15px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      font-weight: bold;
      color: red;
      cursor: pointer;
      background: none;
      border: none;
    }

    .close-button:hover {
      color: darkred;
    }

    #responseBox {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: limegreen;
    }
  </style>
</head>
<body>

  <div class="popup" onclick="recordAction('Clicked popup navigate to website')">
    <button class="close-button"
            onclick="recordAction('Closed the popup')">✖</button>

    <h2>⚠ Critical Security Warning ⚠</h2>
    <p>We've detected a severe virus on your computer!</p>
    <p>Do not close this window / turn off your computer.</p>
    <p>Contact certified support immediately to fix the issue.</p>
    <a href="" onclick="recordAction('Clicked the support link')">Contact Support</a>
  </div>

  <div id="responseBox"></div>

  <script>
    function recordAction(action) {
      document.getElementById('responseBox').innerText = 'You chose to: ' + action;
      window.parent.postMessage({ answer: action }, "*");
    }
  </script>

</body>
</html>
